name: Build Docker Image

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: git.thuanle.me
  IMAGE_NAMESPACE: public

jobs:
  build:
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
        service:
          - api
          - fetcher
          - tele
          - discord
    runs-on: ${{ matrix.arch }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"  # v1.2.3 -> 1.2.3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/cse-mark-${{ matrix.service }}"
          echo "Building $IMAGE for ${{ matrix.arch }} (version $VERSION)"

          docker build \
            -f Dockerfile_${{ matrix.service }} \
            -t "${IMAGE}:${{ matrix.arch }}-${VERSION}" \
            -t "${IMAGE}:${{ matrix.arch }}-latest" \
            --label "version=${VERSION}" \
            --label "commit_sha=${{ github.sha }}" \
            --label "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            .

          docker push "${IMAGE}:${{ matrix.arch }}-${VERSION}"
          docker push "${IMAGE}:${{ matrix.arch }}-latest"

  manifest:
    strategy:
      matrix:
        service:
          - api
          - fetcher
          - tele
          - discord
    runs-on: linux
    needs: [build]
    steps:
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push multi-arch Docker manifest
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/cse-mark-${{ matrix.service }}"

          # Combine the per-arch images into :VERSION and :latest multi-arch tags
          docker manifest rm "${IMAGE}:${VERSION}" || true
          docker manifest create "${IMAGE}:${VERSION}" \
            "${IMAGE}:amd64-${VERSION}" \
            "${IMAGE}:arm64-${VERSION}"
          docker manifest push "${IMAGE}:${VERSION}"

          docker manifest rm "${IMAGE}:latest" || true
          docker manifest create "${IMAGE}:latest" \
            "${IMAGE}:amd64-latest" \
            "${IMAGE}:arm64-latest"
          docker manifest push "${IMAGE}:latest"
